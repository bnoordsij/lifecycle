<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10131d" />
    <title>One Turn — Sine, Cosine & Tangent</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <main class="page">

      <section class="visuals" aria-label="Spring, unit circle, and trigonometric graphs">
        <div class="visual-panel spring-panel">
          <canvas id="springScene" aria-label="A horizontal one-turn 3D spring shown as a sine wave"></canvas>
          <div class="panel-hint">Drag to rotate · pink panel: sin θ × 1/cos θ = tan θ</div>
        </div>
        <div class="visual-panel side-panel">
          <div class="panel-title">Unit circle · θ</div>
          <div class="circle-view">
            <canvas id="circleScene" aria-label="Unit circle showing cosine, sine and tangent"></canvas>
          </div>
          <div class="mini-graphs" aria-label="Trigonometric graphs">
            <article class="mini-graph">
              <h3 class="graph-title sine-title">y = sin θ</h3>
              <svg id="sinGraph" class="graph" viewBox="0 0 420 140" role="img" aria-label="Sine graph over one full rotation"></svg>
            </article>
            <article class="mini-graph">
              <h3 class="graph-title cosine-title">y = cos θ</h3>
              <svg id="cosGraph" class="graph" viewBox="0 0 420 140" role="img" aria-label="Cosine graph over one full rotation"></svg>
            </article>
            <article class="mini-graph">
              <h3 class="graph-title tangent-title">y = tan θ <small>asymptotes at π/2, 3π/2</small></h3>
              <svg id="tanGraph" class="graph" viewBox="0 0 420 140" role="img" aria-label="Tangent graph over one full rotation"></svg>
            </article>
          </div>
        </div>
      </section>

      <section class="readout" aria-live="polite" aria-label="Current trigonometric values">
        <div class="value"><span class="value-label">Angle θ</span><span id="angle" class="number angle">0°</span></div>
        <div class="value"><span class="value-label">Cos θ · x</span><span id="cos" class="number cos">1.000</span></div>
        <div class="value"><span class="value-label">Sin θ · y</span><span id="sin" class="number sin">0.000</span></div>
        <div class="value"><span class="value-label">Tan θ · y / x</span><span id="tan" class="number tan">0.000</span></div>
      </section>

      <div class="controls">
        <button id="play" type="button" aria-pressed="true">Ⅱ Pause</button>
        <input id="slider" type="range" min="0" max="360" step="0.1" value="0" aria-label="Rotation angle in degrees" />
      </div>
      <div class="scale" aria-hidden="true"><span>0°</span><span>90°</span><span>180°</span><span>270°</span><span>360°</span></div>

    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
